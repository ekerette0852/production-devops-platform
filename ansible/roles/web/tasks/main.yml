---
- name: Ensure host nginx package is absent
  ansible.builtin.dnf:
    name: nginx
    state: absent

- name: Ensure production web directory exists
  ansible.builtin.file:
    path: /opt/production-web
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Deploy production web page
  ansible.builtin.copy:
    dest: /opt/production-web/index.html
    owner: root
    group: root
    mode: "0644"
    content: |
      <!DOCTYPE html>
      <html>
      <head>
        <title>Production DevOps Platform</title>
      </head>
      <body>
        <h1>Production DevOps Platform</h1>
        <p>Managed by Ansible through AWS Systems Manager.</p>
        <p>Served by Dockerized Nginx and managed automatically by Ansible.</p>
      </body>
      </html>
  notify: Restart production web container

- name: Ensure production web container is running
  community.docker.docker_container:
    name: production-web
    image: nginx:1.30.4-alpine
    state: started
    restart_policy: unless-stopped
    published_ports:
      - "80:80"
    volumes:
      - /opt/production-web/index.html:/usr/share/nginx/html/index.html:ro
