name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write
  packages: write

env:
  IMAGE_NAME: ghcr.io/ekerette0852/production-devops-app
  IMAGE_VERSION: 1.0.1

jobs:
  build-and-test:
    runs-on: [self-hosted, Linux, X64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            -t production-devops-app:${IMAGE_VERSION} \
            ./cicd/app

      - name: Remove existing test container
        run: docker rm -f production-devops-app 2>/dev/null || true

      - name: Start container
        run: |
          docker run -d \
            --name production-devops-app \
            -p 8888:80 \
            production-devops-app:${IMAGE_VERSION}

      - name: Test application
        run: |
          sleep 3
          curl --fail http://localhost:8888
          curl -s http://localhost:8888 | grep "Production DevOps Platform"

      - name: Show container status
        if: always()
        run: docker ps -a

      - name: Cleanup
        if: always()
        run: docker rm -f production-devops-app || true

      - name: Login to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag Docker image
        if: github.event_name == 'push'
        run: |
          docker tag \
            production-devops-app:${IMAGE_VERSION} \
            ${IMAGE_NAME}:${IMAGE_VERSION}

      - name: Push Docker image to GHCR
        if: github.event_name == 'push'
        run: docker push ${IMAGE_NAME}:${IMAGE_VERSION}

      - name: Update Kubernetes image manifest
        if: github.event_name == 'push'
        run: |
          sed -i "s|image: ${IMAGE_NAME}:.*|image: ${IMAGE_NAME}:${IMAGE_VERSION}|" cicd/kubernetes/deployment.yaml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add cicd/kubernetes/deployment.yaml

          if git diff --cached --quiet; then
            echo "Kubernetes manifest already uses ${IMAGE_VERSION}"
          else
            git commit -m "chore: update Kubernetes image to ${IMAGE_VERSION} [skip ci]"
            git push
          fi
