apiVersion: v1
kind: ServiceAccount
metadata:
  name: production-web
  namespace: production

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: production-web-reader
  namespace: production
rules:
  - apiGroups: [""]
    resources:
      - pods
      - services
      - configmaps
    verbs:
      - get
      - list
      - watch

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: production-web-reader-binding
  namespace: production
subjects:
  - kind: ServiceAccount
    name: production-web
    namespace: production
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: production-web-reader
