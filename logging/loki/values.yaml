backend:
  replicas: 0
deploymentMode: SingleBinary
gateway:
  enabled: true
loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  schemaConfig:
    configs:
    - from: "2024-04-01"
      index:
        period: 24h
        prefix: loki_index_
      object_store: filesystem
      schema: v13
      store: tsdb
  storage:
    type: filesystem
lokiCanary:
  enabled: false
read:
  replicas: 0
singleBinary:
  persistence:
    enabled: true
    size: 10Gi
  replicas: 1
test:
  enabled: false
write:
  replicas: 0
